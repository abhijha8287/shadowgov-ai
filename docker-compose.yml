services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shadowgov
      POSTGRES_PASSWORD: shadowgov
      POSTGRES_DB: shadowgov
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://shadowgov:shadowgov@postgres:5432/shadowgov
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:

